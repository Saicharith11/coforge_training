<h2>Product Catalog Assignment 2</h2>

<table border="1">

    <tr>
        <th>S.No</th>
        <th>Product ID</th>
        <th>Product Name</th>
        <th>Category</th>
        <th>Price</th>
    </tr>

    <tr *ngFor="let product of products; let i = index;
                let evenRow = even; let oddRow = odd"

        [style.backgroundColor]="evenRow ? '#d9f2ff' : '#ffe6e6'">

        <td>{{ i + 1 }}</td>
        <td>{{ product.productId }}</td>
        <td>{{ product.productName }}</td>
        <td>{{ product.category }}</td>
        <td>₹{{ product.price }}</td>

    </tr>

</table>
